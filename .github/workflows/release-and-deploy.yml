name: Release and Deploy

run-name: Release and Deploy ${{ github.ref_name }} by @${{ github.actor }}

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build JARs
    runs-on: ubuntu-latest
    outputs:
      api_jar_artifact_id: ${{ steps.api_jar.outputs.artifact-id }}
      cli_jar_artifact_id: ${{ steps.cli_jar.outputs.artifact-id }}
      dockerfile_artifact_id: ${{ steps.dockerfile.outputs.artifact-id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Java JDK
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Run tests
        run: mvn -B clean test

      - name: Package application
        run: mvn -B package -DskipTests

      - name: Upload API JAR
        id: api_jar
        uses: actions/upload-artifact@v7.0.2
        with:
          name: api-jar
          path: vcs-api/target/*.jar
          if-no-files-found: error

      - name: Upload CLI JAR
        id: cli_jar
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cli-jar
          path: vcs-cli/target/*.jar
          if-no-files-found: error

      - name: Upload Dockerfile
        id: dockerfile
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dockerfile
          path: Dockerfile
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    env:
      ARTIFACTS_DIRECTORY: artifacts

    permissions:
      contents: write
      attestations: write
      id-token: write
      artifact-metadata: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.api_jar_artifact_id }},${{ needs.build.outputs.cli_jar_artifact_id }}
          path: ${{ env.ARTIFACTS_DIRECTORY }}
          merge-multiple: true

      - name: Generate artifact attestations
        uses: actions/attest@v4.2.2
        with:
          subject-path: '${{ env.ARTIFACTS_DIRECTORY }}/*.jar'

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$ARTIFACTS_DIRECTORY"/*.jar \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  docker:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: build

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      API_JAR_DIRECTORY: vcs-api/target

    permissions:
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.api_jar_artifact_id }},${{ needs.build.outputs.dockerfile_artifact_id }}
          merge-multiple: true

      - name: Move API JAR to expected directory
        run: |
          mkdir -p ${{ env.API_JAR_DIRECTORY }}
          mv *.jar ${{ env.API_JAR_DIRECTORY }}

      - name: Login to GHCR
        uses: docker/login-action@v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest@v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Trigger Render Deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error "$RENDER_DEPLOY_HOOK"
